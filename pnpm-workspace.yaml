packages:
  - protocol
  - wrapper/core
  - wrapper/agent-common
  - wrapper/claude-code
  - wrapper/codex
  - wrapper/antigravity
  - wrapper/grok
  - runner
  # dashboard(トップレベル dashboard/)は別ビルド系のため非メンバ。
  # wrapper/ 直下はメタ shim (workspace 非メンバ、scripts のみ)。

# pnpm 10 build-script approval。vitest/tsx が引く esbuild の postinstall を許可。
onlyBuiltDependencies:
  - esbuild

patchedDependencies:
  '@openai/codex-sdk@0.164.0': patches/@openai__codex-sdk@0.164.0.patch

# @xmldom/xmldom is pinned to exactly 0.9.12 by pnpm.overrides in package.json.
# Its only dependent is officeparser (wrapper/claude-code). Remove the override
# once officeparser resolves @xmldom/xmldom >= 0.9.12 by itself; check with
# `pnpm why @xmldom/xmldom`.
