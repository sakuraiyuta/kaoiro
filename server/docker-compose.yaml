# Local verification compose for the kaoiro server (prod release image).
#
# Usage:
#   cp .env.example .env   # set SECRET_KEY_BASE (mix phx.gen.secret) and
#                          # KAOIRO_CLIENT_TOKENS (required, issue #28)
#   docker compose up -d --build
#   # dashboard: http://localhost:4000/?token=<KAOIRO_CLIENT_TOKENS token>
#
# Deployment (gateway / another host) reuses this file as-is: adjust
# .env (PHX_HOST, auth tokens) and put the service behind the central
# nginx reverse proxy — TLS terminates there, Phoenix stays plain HTTP
# (2026-06-11 decision; WebSocket needs Upgrade/Connection forwarding
# and proxy_read_timeout > 60s for the 30s channel heartbeat).
services:
  kaoiro:
    # Context is the repo root, not server/: the Dockerfile's node stage
    # builds the dashboard from /dashboard, which sits outside server/
    # (issue #44). Root .dockerignore keeps the context small.
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        # Compile-time plain-HTTP toggle (config/prod.exs). Interpolated
        # from .env so build and runtime always get the same value —
        # the release raises at boot when they disagree.
        KAOIRO_PLAIN_HTTP: ${KAOIRO_PLAIN_HTTP:-false}
        # Build identity (issue #228). `.dockerignore` excludes `.git` from
        # the build context (nothing in the Dockerfile reads it), so this
        # MUST come from the environment of whoever runs `docker compose
        # build` — e.g. `eval "$(node scripts/build-identity.mjs)"; docker
        # compose build` (docs/specs/deployment.md 4.3). Left unset ->
        # "unknown"/"false", which GET /api/health then reports honestly
        # rather than silently claiming a revision nobody actually built.
        # KAOIRO_BUILD_DIRTY joined the single revision-only arg in round 2
        # (ふじ MF-2 差し戻し): round 1 baked revision alone, so a dirty
        # checkout's image could claim the same identity as a clean one at
        # the same commit.
        KAOIRO_BUILD_REVISION: ${KAOIRO_BUILD_REVISION:-unknown}
        KAOIRO_BUILD_DIRTY: ${KAOIRO_BUILD_DIRTY:-false}
    image: kaoiro-server:latest
    # Loopback-only by default. Auth (issue #28): KAOIRO_CLIENT_TOKENS
    # unset REJECTS all dashboard connections (fail-closed) — set it even
    # for local use, then open the dashboard with ?token=<token>.
    # KAOIRO_WRAPPER_TOKENS unset leaves wrapper auth open (dev mode), and
    # an operator can drive tool execution on agent hosts
    # (specs/threat-model.md) — never publish beyond 127.0.0.1 without it.
    # Behind the central nginx proxy, widen the bind (or drop ports for a
    # shared network) only together with mandatory tokens. Direct VPN
    # deployments (no proxy) set KAOIRO_PUBLISH_IP in .env to the host's
    # VPN-side interface IP — never a public one.
    ports:
      - "${KAOIRO_PUBLISH_IP:-127.0.0.1}:4000:4000"
    env_file:
      - .env
    # Restart-surviving state (session pointers / agent identity ledger /
    # permission modes, ADR-0014/0030). Without this the DETS files
    # default to /tmp inside the container and vanish on `docker compose
    # down`, taking the offline-agent list with them so a `dogfood.sh`
    # restart cannot restore prior agents. `/var/lib/kaoiro` is
    # pre-created as nobody-owned in the Dockerfile so the named volume
    # is writable by the runtime user.
    environment:
      KAOIRO_SESSION_POINTERS_PATH: /var/lib/kaoiro/session_pointers.dets
      KAOIRO_AGENT_DIRECTORY_PATH: /var/lib/kaoiro/agent_directory.dets
      KAOIRO_PERMISSION_MODES_PATH: /var/lib/kaoiro/permission_modes.dets
      KAOIRO_CLEAR_WATERMARKS_PATH: /var/lib/kaoiro/clear_watermarks.dets
      KAOIRO_SESSION_STARTS_PATH: /var/lib/kaoiro/session_starts.dets
      KAOIRO_INGRESS_ORDER_PATH: /var/lib/kaoiro/ingress_order.dets
      # Recipient-local dispatch-confirmation ledger (issue #247). This is
      # diagnostic state, but must survive a container recreate so a pending
      # gap remains observable until the recipient process re-joins.
      KAOIRO_DELIVERY_STATES_PATH: /var/lib/kaoiro/delivery_states.dets
      # User identity ledger (issue #197, ADR-0050 D1). Same rationale as
      # the agent identity ledger above: unset falls back to a tmp path
      # that survives a process restart but NOT a fresh container. A lost
      # entry re-issues a new user_id and resets display_name to its
      # initial value on that source's next login, breaking issue #197's
      # 「変更が再起動を跨いで保持される」acceptance. Omitted until issue
      # #227 — a container recreate silently dropped the ledger, and the
      # deploy backup could not restore what was never on the volume.
      KAOIRO_USERS_PATH: /var/lib/kaoiro/users.dets
      # Token denylist: authoritative store of revoked agent_ids for
      # fail-closed auth (ふじ #120 must-fix 1, 2026-07-25). Must live on
      # the named volume — a lost entry silently re-grants a revoked
      # identity.
      KAOIRO_TOKEN_DENYLIST_PATH: /var/lib/kaoiro/token_denylist.dets
      # session_lifecycle timeline (ADR-0055, phase-33 Stage B). Same
      # rationale as the ledgers above: unset falls back to a tmp path
      # wiped on container recreation, so the compaction/reconnect
      # history an operator would review goes silently missing.
      KAOIRO_SESSION_LIFECYCLE_EVENTS_PATH: /var/lib/kaoiro/session_lifecycle_events.dets
      # Persona pack extraction cache (ADR-0046). Kept off the ingest dir
      # so a `:ro` persona overlay still cold-starts. On the named volume
      # rather than /tmp only to skip re-extracting every pack after a
      # container recreation — the cache is derived from the zips.
      KAOIRO_PERSONA_CACHE_DIR: /var/lib/kaoiro/persona-cache
    volumes:
      - kaoiro-state:/var/lib/kaoiro
      # Sprite overlay (ADR-0008): uncomment and set KAOIRO_PERSONA_DIR
      # =/personas in .env to override bundled sets.
      # - ./personas-overlay:/personas:ro
      # Common footer (ADR-0045): uncomment and set KAOIRO_FOOTER_DIR
      # =/etc/kaoiro/footers in .env to edit system-footer.md /
      # user-footer.md without rebuilding. Read-only by design — the
      # server only reads this root. Keep the HOST side outside this
      # repo (F3: operator footers stay out of git, and no .gitignore
      # line backstops a `./footers` here the way it does for .env).
      # - /srv/kaoiro/footers:/etc/kaoiro/footers:ro
      - ./oauth-allowlist.txt:/etc/kaoiro/oauth-allowlist.txt:ro

    restart: unless-stopped

volumes:
  kaoiro-state:
