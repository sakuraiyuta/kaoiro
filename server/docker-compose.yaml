# Local verification compose for the kaoiro server (prod release image).
#
# Usage:
#   cp .env.example .env   # set SECRET_KEY_BASE (mix phx.gen.secret) and
#                          # KAOIRO_CLIENT_TOKENS (required, issue #28)
#   docker compose up -d --build
#   # dashboard: http://localhost:4000/?token=<KAOIRO_CLIENT_TOKENS token>
#
# Deployment (gateway / another host) reuses this file as-is: adjust
# .env (PHX_HOST, auth tokens) and put the service behind the central
# nginx reverse proxy — TLS terminates there, Phoenix stays plain HTTP
# (2026-06-11 decision; WebSocket needs Upgrade/Connection forwarding
# and proxy_read_timeout > 60s for the 30s channel heartbeat).
services:
  kaoiro:
    build: .
    image: kaoiro-server:latest
    # Loopback-only by default. Auth (issue #28): KAOIRO_CLIENT_TOKENS
    # unset REJECTS all dashboard connections (fail-closed) — set it even
    # for local use, then open the dashboard with ?token=<token>.
    # KAOIRO_WRAPPER_TOKENS unset leaves wrapper auth open (dev mode), and
    # an operator can drive tool execution on agent hosts
    # (specs/threat-model.md) — never publish beyond 127.0.0.1 without it.
    # Behind the central nginx proxy, widen the bind (or drop ports for a
    # shared network) only together with mandatory tokens.
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env
    # Restart-surviving state (session pointers / agent identity ledger /
    # permission modes, ADR-0014/0030). Without this the DETS files
    # default to /tmp inside the container and vanish on `docker compose
    # down`, taking the offline-agent list with them so a `dogfood.sh`
    # restart cannot restore prior agents. `/var/lib/kaoiro` is
    # pre-created as nobody-owned in the Dockerfile so the named volume
    # is writable by the runtime user.
    environment:
      KAOIRO_SESSION_POINTERS_PATH: /var/lib/kaoiro/session_pointers.dets
      KAOIRO_AGENT_DIRECTORY_PATH: /var/lib/kaoiro/agent_directory.dets
      KAOIRO_PERMISSION_MODES_PATH: /var/lib/kaoiro/permission_modes.dets
      KAOIRO_INTER_AGENT_HISTORY_PATH: /var/lib/kaoiro/inter_agent_history.dets
    volumes:
      - kaoiro-state:/var/lib/kaoiro
      # Sprite overlay (ADR-0008): uncomment and set KAOIRO_PERSONA_DIR
      # =/personas in .env to override bundled sets.
      # - ./personas-overlay:/personas:ro
    restart: unless-stopped

volumes:
  kaoiro-state:
