name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  wrapper:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wrapper
    steps:
      - uses: actions/checkout@v4
      # Codex's bubblewrap sandbox needs user namespaces: https://github.com/openai/codex-action/blob/main/action.yml#L290-L315
      - name: Enable Codex sandbox user namespaces
        shell: bash
        run: |
          set -euo pipefail

          configure_userns_sysctl() {
            local key="$1"
            local expected="$2"
            local before after
            before="$(sysctl -n "$key" 2>/dev/null || true)"
            echo "$key before: ${before:-unavailable}"
            if [ -z "$before" ]; then
              echo "$key after: unavailable"
              return
            fi
            if [ "$before" != "$expected" ]; then
              if ! sudo sysctl -w "$key=$expected"; then
                after="$(sysctl -n "$key" 2>/dev/null || true)"
                echo "$key after: ${after:-unavailable}"
                echo "::error::Could not set $key=$expected for the Codex sandbox."
                exit 1
              fi
            fi
            after="$(sysctl -n "$key" 2>/dev/null || true)"
            echo "$key after: ${after:-unavailable}"
            if [ "$after" != "$expected" ]; then
              echo "::error::$key must be $expected for the Codex sandbox."
              exit 1
            fi
          }

          configure_userns_sysctl kernel.unprivileged_userns_clone 1
          configure_userns_sysctl kernel.apparmor_restrict_unprivileged_userns 0

          if unshare -Ur true; then
            echo "Codex sandbox user namespace probe: passed"
          else
            echo "::error::Codex sandbox requires a usable unprivileged user namespace; M1/M2 were not run."
            exit 1
          fi

          echo "NC2: no unload, no assertion"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # antigravity's pretest builds its own dist (hook.js / bridge.js are
      # spawned as real processes), and that build needs the sibling
      # workspace packages' dist, so build the whole wrapper first.
      - run: pnpm build
      - run: uname -r && head -2 /etc/os-release && (bwrap --version || true)
      - run: pnpm test

  # No `working-directory` default here: the install has to happen at the
  # workspace root, and runner's typecheck needs the wrapper packages' emitted
  # .d.ts files (they are workspace deps, so an unbuilt wrapper fails with
  # TS2307).
  runner:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C wrapper build
      - run: pnpm -C runner typecheck
      - run: pnpm -C runner test

  # server/deploy (issue #306) has no dependencies of its own (plain
  # node:test, no package-lock.json) and is NOT covered by the `server`
  # job below — that job runs `mix test` only, inside an Elixir-only
  # image with no node binary at all, so nothing here ever ran in CI
  # until this job existed (クロエ-sub finding, #306 round 3: every prior
  # green `node --test` count was a LOCAL claim only).
  server-deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: server/deploy
    steps:
      - uses: actions/checkout@v4
      - name: Fetch previous deploy CLI revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$(cat "$GITHUB_WORKSPACE/server/deploy/test-support/previous-cli-revision.txt")"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$revision"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  # Test isolation contract (issue #577, docs/contributing/test-isolation.md):
  # every test entry loads the isolation guard, and the guard refuses host
  # tools and outbound network. The checker lists each Vitest suite with the
  # package's own Vitest, so it needs the dependencies and what the accepted
  # test scripts build first (wrapper, including antigravity and grok, and runner).
  test-isolation:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # v4
      - name: Fetch previous deploy CLI revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$(cat "$GITHUB_WORKSPACE/server/deploy/test-support/previous-cli-revision.txt")"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$revision"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C dashboard install --frozen-lockfile
      - run: pnpm -C wrapper build
      - run: pnpm -C runner build
      - run: node scripts/test-isolation/check.mjs
      - run: node scripts/test-isolation/run-node-tests.mjs
      - run: node --test scripts/test/test-isolation.test.mjs scripts/test/check-test-isolation.test.mjs scripts/test/child-process-environment.test.mjs scripts/test/codex-backend-compatibility.test.mjs

  # Checks out on the host, then runs mix inside a pinned Elixir image.
  #
  # Three findings from measuring this on the actual runner:
  #   - erlef/setup-beam: its prebuilt OTP cannot load :crypto on the Gitea
  #     runner image (no matching libssl), so mix dies fetching rebar.
  #   - `container:` with a hexpm image: it ships no node, so every JS action
  #     (actions/checkout) fails with exit 127. Hence the explicit
  #     `docker run`, which the server-image job proves works here.
  #   - `docker run -v "$PWD:/src"`: the step itself already runs inside a
  #     container, so the daemon resolves the bind mount against ITS OWN
  #     filesystem and mounts an empty dir ("Could not find a Mix.Project").
  #     The source therefore has to reach the container as a stream, the same
  #     way `docker build` sends its context — hence the tar pipe below.
  #
  # The image matches what server/Dockerfile builds the release with — issue
  # #143 aligned the two. Keep them in step when bumping either: the previous
  # release pin (OTP 26) could not compile this suite's Japanese test names at
  # all ("argument 1: not an iolist term"), which is what surfaced the drift.
  server:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: mix checks
        shell: bash
        run: |
          # --no-xattrs drops attributes the build has no use for. Reproducing
          # this on macOS additionally needs COPYFILE_DISABLE=1: bsdtar's
          # copyfile metadata is separate from xattrs and unpacks as
          # AppleDouble files, which `mix format` then parses as Elixir.
          #
          # mix runs as a non-root `ci` user (issue #182): the container
          # otherwise runs as root, under which the phase-29 permission-denial
          # tests (chmod-based simulations) are no-ops, since root ignores
          # permission bits — the suite passed 781/784 with the 3 permission
          # tests silently not exercising their raise/error path.
          #
          # set -o pipefail (issue #182, ふじ M1): without it, this pipe's
          # exit status is the RIGHT side's (docker run) only, so a `tar`
          # failure that still hands docker a consumable stream would go
          # unnoticed.
          set -euo pipefail
          node --test scripts/test/extract-session-reset-request-reply-vocabulary.test.mjs
          KAOIRO_SESSION_RESET_REQUEST_REPLY_REASONS="$(node scripts/extract-session-reset-request-reply-vocabulary.mjs)"
          export KAOIRO_SESSION_RESET_REQUEST_REPLY_REASONS
          node --test scripts/test/extract-peer-session-reset-reply-vocabulary.test.mjs
          KAOIRO_PEER_SESSION_RESET_REPLY_REASONS="$(node scripts/extract-peer-session-reset-reply-vocabulary.mjs)"
          export KAOIRO_PEER_SESSION_RESET_REPLY_REASONS
          # RuntimeConfigTest also reads the repository's scripts/dev.sh and
          # docs/reference/configuration/server.md (the canonical DETS store
          # list, issue #307), and SessionPointerRecoveryTest reads
          # docs/operations/session-pointer-recovery.md (issue #515);
          # anything a server test reads from outside
          # server/ has to be listed in this tar or the test fails only in CI.
          #
          # `-e CI` (issue #282 案a): `docker run` does not inherit the
          # runner's environment automatically -- Actions sets `CI=true`
          # on the JOB, not inside this container, so `mix test`
          # (test_helper.exs) would never see it without this explicit
          # pass-through. Value omitted so a local manual run of this same
          # command (no CI var set) leaves it unset inside the container
          # too, matching the local default.
          tar --no-xattrs -cf - server scripts docs/reference/configuration/server.md \
            docs/operations/session-pointer-recovery.md \
            protocol/fixtures runner/test/fixtures | docker run --rm -i -w /w \
            -e CI \
            -e KAOIRO_SESSION_RESET_REQUEST_REPLY_REASONS \
            -e KAOIRO_PEER_SESSION_RESET_REPLY_REASONS \
            docker.io/hexpm/elixir:1.20.1-erlang-29.0.2-debian-trixie-20260610-slim \
            sh -euc '
              tar -xf - -C /w
              # inotify-tools backs :file_system, which PersonaWatcher,
              # FooterWatcher, and OAuthAllowlistWatcher (issue #160)
              # all use. Without it, PersonaWatcher/FooterWatcher fall
              # back to :ignore (no fast path) and OAuthAllowlistWatcher
              # degrades to poll-only. server/Dockerfile already
              # installs this for the same reason (issue #142) -- this
              # pin was missing only from the CI container, which does
              # not go through that Dockerfile. Installed as root,
              # before the su below (the ci user has no apt privileges).
              apt-get update
              apt-get install -y --no-install-recommends inotify-tools
              rm -rf /var/lib/apt/lists/*
              useradd -m -d /home/ci ci
              chown -R ci:ci /w
              su ci -c "
                set -e
                export HOME=/home/ci
                cd /w/server
                mix local.hex --force
                mix local.rebar --force
                mix deps.get
                mix format --check-formatted
                mix compile --warnings-as-errors
                MIX_ENV=test mix run --no-start scripts/check_session_reset_request_reply_vocabulary.exs
                MIX_ENV=test mix run --no-start scripts/check_peer_session_reset_reply_vocabulary.exs

                # issue #282: permanent lightweight runner-stall probe.
                # Samples the monotonic clock every 10ms around mix test;
                # a gap over 100ms between consecutive samples means THIS
                # PROCESS went unscheduled longer than ExUnit default
                # assert_receive_timeout, regardless of cause (CPU steal,
                # cgroup throttle, hypervisor pause, ...) -- a net that
                # catches the effect without needing to know the cause.
                # Fail-soft throughout: probe start/stop never gates the
                # real test result, only mix test own exit code does.
                (
                  prev=\$(date +%s%N)
                  while true; do
                    sleep 0.01
                    now=\$(date +%s%N)
                    diff_ms=\$(( (now - prev) / 1000000 ))
                    if [ \"\$diff_ms\" -gt 100 ]; then
                      echo \"GAP \$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ) diff_ms=\$diff_ms\" >> /tmp/gap.log
                    fi
                    prev=\$now
                  done
                ) >/dev/null 2>&1 &
                GAP_PID=\$!

                # set -e stays OFF until exit below: every line from here
                # on is diagnostic (probe teardown + log printing), and
                # my-review flagged that restoring set -e too early let a
                # transient failure in the log-printing block itself abort
                # this step with the WRONG exit code even when mix test
                # passed. Only TEST_EXIT (captured before this point) may
                # decide this step outcome.
                set +e
                mix test
                TEST_EXIT=\$?

                kill \$GAP_PID >/dev/null 2>&1 || true

                echo \"=== runner stall probe (issue #282): monotonic clock gaps over 100ms ===\"
                if [ -s /tmp/gap.log ]; then
                  cat /tmp/gap.log
                else
                  echo \"no gaps over 100ms detected\"
                fi

                exit \$TEST_EXIT
              "
            '

  dashboard:
    runs-on: ubuntu-26.04
    timeout-minutes: 6
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  # Build context is the repository root (issue #70): the Dockerfile's node
  # stage bundles the dashboard from /dashboard. Publishing waits on the
  # registry decision (issue #140), so this only proves the image still
  # builds.
  server-image:
    runs-on: ubuntu-26.04
    # Raised from 5 for the G56 boot-and-probe step below (issue 801); set
    # it from the first run's measured build + boot + probe time.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t kaoiro-server:ci .
      # issue #322 M5 follow-up (must-1): the deploy CLI decides module
      # PRESENCE from this beam-file glob BEFORE ever calling eval — pins
      # the glob this image's own release layout actually has it at,
      # reading the CLI's own exported constant (never a literal copied
      # here, which would drift silently if the release layout changes
      # and the CLI's probe kept using the real one).
      - name: deploy CLI persistence-path beam probe
        shell: bash
        run: |
          set -euo pipefail
          GLOB=$(node --input-type=module -e '
            import { PERSISTENCE_PATHS_BEAM_GLOB } from "./server/deploy/kaoiro-server-deploy.mjs";
            console.log(PERSISTENCE_PATHS_BEAM_GLOB);
          ')
          docker run --rm --entrypoint /bin/sh kaoiro-server:ci -c "ls $GLOB"
      # old_sha is read from the old image's own build info, so prove the
      # deploy CLI's exported path exists in the image we just built. This CI
      # build has no revision argument and intentionally reports "unknown".
      - name: deploy CLI old-image build info
        shell: bash
        run: |
          set -euo pipefail
          BUILD_INFO_PATH=$(node --input-type=module -e '
            import { OLD_IMAGE_BUILD_INFO_PATH } from "./server/deploy/kaoiro-server-deploy.mjs";
            console.log(OLD_IMAGE_BUILD_INFO_PATH);
          ')
          docker run --rm --entrypoint cat kaoiro-server:ci "$BUILD_INFO_PATH" > build-info.json
          node -e '
            const buildInfo = JSON.parse(require("fs").readFileSync("build-info.json", "utf8"));
            if (typeof buildInfo.revision !== "string") {
              throw new Error("build-info revision is not a string");
            }
          '
      # The deploy CLI reads the persistence-path manifest out of the image
      # with exactly this command and passes NO env
      # (docs/operations/server-update-and-rollback.md 4.3). Addressing by
      # image id is the CLI's own property, not this
      # step's: here the tag names the image the previous step just built,
      # and nothing can move it in between. Two accidents are pinned, both
      # measured 2026-09-07 and both invisible to `mix test`: runtime.exs
      # raising under an env-less Config.Provider before ce0ef832's
      # RELEASE_COMMAND=="eval" relaxation landed (issue #310), and
      # anything the VM prints to stdout ahead of the JSON (a missing
      # libsctp1 did) — which the CLI treats as actively wrong and fails
      # the update on.
      - name: deploy CLI persistence-path probe
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /app/bin/kaoiro_server kaoiro-server:ci \
            eval 'IO.puts(Jason.encode!(KaoiroServer.PersistencePaths.manifest()))' \
            > manifest.json
          node -e '
            const entries = JSON.parse(require("fs").readFileSync("manifest.json", "utf8"));
            if (!Array.isArray(entries) || entries.length === 0) {
              throw new Error("manifest is not a non-empty JSON array");
            }
            const keys = ["default_file", "default_path", "env", "store"];
            for (const entry of entries) {
              const own = Object.keys(entry).sort();
              if (own.length !== keys.length || own.some((k, i) => k !== keys[i])) {
                throw new Error("entry keys are not exactly " + keys + ": " + JSON.stringify(entry));
              }
              for (const key of keys) {
                if (typeof entry[key] !== "string" || entry[key] === "") {
                  throw new Error(key + " is not a non-empty string: " + JSON.stringify(entry));
                }
              }
              if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(entry.env)) {
                throw new Error("env is not a shell identifier: " + entry.env);
              }
            }
            console.log("persistence-path manifest OK (" + entries.length + " stores)");
          '
      # G56 (issue 801, device authorization grant): boot the image built
      # above with production settings and probe its entry over loopback
      # http, as the TLS-terminating proxy would reach it. Claim cells are
      # asserted; every other header and body is an observation written to
      # the job summary and never fails the job. Device and user codes are
      # redacted before anything is printed. All values are throwaway.
      - name: device authorization entry probe (G56)
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g56"
          mkdir -p "$out"
          secret=$(openssl rand -hex 64)
          common=(
            -e SECRET_KEY_BASE="$secret" -e PHX_HOST=kaoiro.example
            -e KAOIRO_OAUTH_NEXTCLOUD_CLIENT_ID=ci
            -e KAOIRO_OAUTH_NEXTCLOUD_CLIENT_SECRET=ci
            -e KAOIRO_OAUTH_NEXTCLOUD_BASE_URL=https://cloud.example
          )
          docker run -d --name kaoiro-g56 -p 127.0.0.1:4000:4000 "${common[@]}" kaoiro-server:ci
          # (e): every name an implementation could plausibly read the
          # insecure-transport exception from. None may take effect.
          docker run -d --name kaoiro-g56-env -p 127.0.0.1:4001:4000 "${common[@]}" \
            -e KAOIRO_DEVICE_AUTH_ALLOW_INSECURE_TRANSPORT=true \
            -e DEVICE_AUTH_ALLOW_INSECURE_TRANSPORT=true \
            -e KAOIRO_ALLOW_INSECURE_TRANSPORT=true \
            -e KAOIRO_DEVICE_AUTH_INSECURE=true \
            kaoiro-server:ci

          wait_ready() {
            local port=$1 started=$SECONDS
            # No Host header: curl's 127.0.0.1 is an excluded host, so the
            # health check is not redirected.
            until [ "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/api/health")" = 200 ]; do
              if (( SECONDS - started > 60 )); then
                echo "port $port did not answer /api/health with 200 within 60 s" >&2
                docker logs kaoiro-g56 >&2 || true
                docker logs kaoiro-g56-env >&2 || true
                exit 1
              fi
              sleep 1
            done
            echo "port $port ready after $(( SECONDS - started )) s"
          }
          wait_ready 4000
          wait_ready 4001

          form=(-H 'content-type: application/x-www-form-urlencoded' --data-binary 'client_id=x')
          json=(-H 'content-type: application/json' --data-binary '{')
          https=(-H 'x-forwarded-proto: https')
          # probe ROW PORT CURL_ARGS... -> $out/ROW.{status,headers,body}
          probe() {
            local row=$1 port=$2
            shift 2
            curl -sS -o "$out/$row.body" -D "$out/$row.headers" -w '%{http_code}' \
              "$@" "http://127.0.0.1:$port${path}" > "$out/$row.status"
          }
          path=/oauth/device
          probe a 4000 -H 'host: kaoiro.example' "${https[@]}" "${form[@]}"
          probe b 4000 -H 'host: kaoiro.example' "${form[@]}"
          probe c 4000 -H 'host: localhost' "${https[@]}" "${form[@]}"
          probe d 4000 -H 'host: localhost' "${form[@]}"
          probe e 4001 -H 'host: localhost' "${form[@]}"
          probe f 4000 -H 'host: kaoiro.example' "${https[@]}" "${json[@]}"
          path=/session/new
          probe g 4000 -H 'host: kaoiro.example' "${https[@]}" "${json[@]}"
          path=/session/auth-methods
          probe h_on 4000 -H 'host: kaoiro.example' "${https[@]}"
          probe h_off 4000 -H 'host: kaoiro.example'

          status() { cat "$out/$1.status"; }
          has_header() { grep -qiE "^$2" "$out/$1.headers"; }
          check_a() {
            [ "$(status a)" = 200 ] &&
              has_header a 'strict-transport-security: max-age=31536000' &&
              jq -e 'has("device_code")' "$out/a.body" > /dev/null
          }
          check_b() { [ "$(status b)" = 307 ] && has_header b 'location: https://kaoiro\.example/'; }
          check_c() { [ "$(status c)" = 200 ] && ! has_header c 'strict-transport-security:'; }
          check_d() { [ "$(status d)" = 503 ]; }
          check_e() { [ "$(status e)" = 503 ]; }
          check_f() { [ "$(status f)" = 415 ]; }
          check_g() { [ "$(status g)" = 400 ]; }
          check_h_on() {
            [ "$(status h_on)" = 200 ] && jq -e '.device == true' "$out/h_on.body" > /dev/null
          }
          check_h_off() { [ "$(status h_off)" = 301 ] && has_header h_off 'location: https://kaoiro\.example/'; }
          failures=()
          claim() { if ! "check_$1"; then failures+=("($1) expected $2"); fi; }
          claim a "200 + HSTS + device_code in the body"
          claim b "307 + Location on kaoiro.example"
          claim c "200 without HSTS"
          claim d "503"
          claim e "503 with the exception-like env"
          claim f "415"
          claim g "400 (status only)"
          claim h_on "200 + device: true"
          claim h_off "301 + Location on kaoiro.example"

          # Observations: every status, header and body, codes redacted.
          redact='if type == "object" then with_entries(if (.key | IN("device_code", "user_code", "verification_uri_complete")) then .value = "<redacted>" else . end) else . end'
          {
            echo "## G56 device authorization entry probe"
            for row in a b c d e f g h_on h_off; do
              echo "### ($row) status $(status "$row")"
              echo '```'
              tr -d '\r' < "$out/$row.headers"
              if [ ! -s "$out/$row.body" ]; then
                echo "(empty body)"
              elif jq -c "$redact" "$out/$row.body" 2> /dev/null; then
                :
              else
                echo "(non-JSON body, $(wc -c < "$out/$row.body") bytes)"
              fi
              echo '```'
            done
            if [ "${#failures[@]}" -gt 0 ]; then
              echo "### Claim cells that failed"
              printf -- '- %s\n' "${failures[@]}"
            else
              echo "### All claim cells held"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          [ "${#failures[@]}" -eq 0 ]
      - name: remove the G56 containers
        if: always()
        run: docker rm -f kaoiro-g56 kaoiro-g56-env || true
