name: Issue 856 CI measurement
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  node-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C dashboard install --frozen-lockfile
      - run: pnpm -C wrapper build
      - run: pnpm -C runner build
      - name: Node event shape probe
        run: sh .github/issue-856-node-test-probe.sh
      - name: github-issue-import
        continue-on-error: true
        run: node --test scripts/test/github-issue-import.test.mjs
      - name: pre-gate
        continue-on-error: true
        run: node --test scripts/test/pre-gate.test.mjs
      - name: runner-pairing
        continue-on-error: true
        run: node --test scripts/test/runner-pairing.test.mjs
      - name: pre-gate-real
        continue-on-error: true
        env:
          KAOIRO_PREGATE_REAL: '1'
        run: node --test scripts/test/pre-gate-real.test.mjs
